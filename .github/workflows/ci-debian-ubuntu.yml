name: CI - Debian & Ubuntu Family

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'ubuntu:24.04'
          - 'ubuntu:22.04'
          - 'debian:12-slim'
          - 'debian:11-slim'
    steps:
      - name: Install bootstrap dependencies
        run: |
          apt-get update -y
          apt-get install -y sudo curl git zsh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unattended installation
        run: ./install.sh -y

      - name: Verify ZSH initialization
        run: zsh -i -c "echo 'ZSH Initialized Successfully'"

      - name: Verify aliases, helpers and environment
        run: |
          zsh -i -c "which take extract ls ll bat fd atuin posh-theme"
          zsh -i -c "posh-theme tokyo && cat ~/.config/zsh/current_theme"
