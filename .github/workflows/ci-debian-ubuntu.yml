name: CI - Debian & Ubuntu Family

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'ubuntu:24.04'
          - 'ubuntu:22.04'
          - 'debian:12-slim'
          - 'debian:11-slim'
    steps:
      - name: Install bootstrap dependencies
        run: |
          apt-get update -y
          apt-get install -y sudo curl git zsh ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unattended installation
        run: ./install.sh -y

      - name: Verify ZSH initialization and execution
        run: |
          zsh -i -c "echo 'ZSH Initialized Successfully'"
          zsh -i -c "take /tmp/test_dir && echo 'Helper take OK'"
          zsh -i -c "posh-theme tokyo && test -f ~/.local/state/zsh/current_theme && echo 'Posh theme OK'"

      - name: Test Symlink mode installation
        run: |
          ./install.sh -y -s
          test -d ~/.config/zsh
          test -L ~/.config/zsh/.zshrc
          test -L ~/.zshenv
          zsh -i -c "echo 'Symlink mode ZSH OK'"
