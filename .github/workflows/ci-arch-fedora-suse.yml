name: CI - Arch, Fedora & openSUSE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'archlinux:base'
          - 'fedora:41'
          - 'fedora:40'
          - 'opensuse/leap:15.6'
    steps:
      - name: Install bootstrap dependencies
        run: |
          if command -v pacman >/dev/null 2>&1; then
            pacman-key --init || true
            pacman-key --populate archlinux || true
            pacman -Syu --noconfirm --needed sudo curl git zsh ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y --allowerasing sudo curl git zsh util-linux ca-certificates
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive install -y sudo curl git zsh ca-certificates
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unattended installation
        run: ./install.sh -y

      - name: Verify ZSH initialization and execution
        run: |
          zsh -i -c "echo 'ZSH Initialized Successfully'"
          zsh -i -c "take /tmp/test_dir && echo 'Helper take OK'"
          zsh -i -c "posh-theme clean-detailed && test -f ~/.config/zsh/current_theme && echo 'Posh theme OK'"
