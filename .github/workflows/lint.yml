name: Lint and Syntax Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: ShellCheck and Syntax Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zsh shellcheck

      - name: Run ShellCheck on install.sh
        run: shellcheck -e SC1091,SC2086,SC2034 install.sh

      - name: Validate ZSH syntax
        run: |
          for f in .config/zsh/*.zsh .config/zsh/.zshrc .config/zsh/.zshenv .zshenv; do
            echo "Checking syntax: $f"
            zsh -n "$f"
          done
