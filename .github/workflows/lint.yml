name: Lint and Syntax Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck, Syntax, JSON and Security Pattern Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zsh shellcheck python3

      - name: Run make lint
        run: make lint
