name: CI - Enterprise & Alpine Family

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'rockylinux:9'
          - 'almalinux:9'
          - 'alpine:3.21'
          - 'alpine:3.20'
    steps:
      - name: Install bootstrap dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk update && apk add sudo curl git zsh bash shadow ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y --allowerasing sudo curl git zsh util-linux ca-certificates
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unattended installation
        run: ./install.sh -y

      - name: Verify ZSH initialization and execution
        run: |
          zsh -i -c "echo 'ZSH Initialized Successfully'"
          zsh -i -c "take /tmp/test_dir && echo 'Helper take OK'"

      - name: Test Symlink mode installation
        run: |
          ./install.sh -y -s
          test -d ~/.config/zsh
          test -L ~/.config/zsh/.zshrc
          test -L ~/.zshenv
          zsh -i -c "echo 'Symlink mode ZSH OK'"
