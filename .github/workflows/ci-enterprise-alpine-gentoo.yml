name: CI - Enterprise, Alpine & Gentoo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'rockylinux:9'
          - 'almalinux:9'
          - 'alpine:latest'
          - 'gentoo/stage3:latest'
    steps:
      - name: Install bootstrap dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk update && apk add sudo curl git zsh bash shadow
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y sudo curl git zsh util-linux
          elif command -v emerge >/dev/null 2>&1; then
            emerge --quiet app-shells/zsh app-admin/sudo dev-vcs/git net-misc/curl
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unattended installation
        run: ./install.sh -y

      - name: Verify ZSH initialization
        run: zsh -i -c "echo 'ZSH Initialized Successfully'"

      - name: Verify helpers and environment
        run: zsh -i -c "which take extract"
